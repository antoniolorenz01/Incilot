# RAG exam: questions like the ones the agent asks during an incident, with the known
# correct chunks. A question is a hit if it retrieves any of its `expected` chunks.
# Chunk ids are the `source` values from corpus.py.
#
# `expected` includes every section that genuinely answers the question (checked by
# hand), not just the one we had in mind. The "where is it in the code" questions are
# strict: they measure whether the RAG finds code.

[[questions]]
query = "queries on products are waiting for a lock and postgres logs still waiting"
expected = ["runbooks/postgres-locks.md"]

[[questions]]
query = "timeouts on every inventory route with no postgres errors, idle connections"
expected = ["runbooks/connection-pool-exhausted.md"]

[[questions]]
query = "shop's memory keeps rising even though traffic is stable"
expected = ["runbooks/growing-memory.md"]

[[questions]]
query = "lots of orders are failing with payment_declined"
expected = ["runbooks/payment-declines-and-429.md"]

[[questions]]
query = "payments responds 429 and orders fail with payments_unavailable"
expected = ["runbooks/payment-declines-and-429.md", "config/payments.env"]

[[questions]]
query = "charges are slow and time out but there were no internal changes in payments"
expected = ["runbooks/external-provider-degraded.md"]

[[questions]]
query = "out_of_stock is increasing even though sales have not grown"
expected = ["runbooks/stock-not-recovering.md"]

[[questions]]
query = "inventory's p95 went up to 900 ms"
expected = ["runbooks/high-latency.md"]

[[questions]]
query = "500 error rate with a KeyError traceback in users"
expected = ["runbooks/error-rate.md"]

[[questions]]
query = "redis is not responding, connection refused from users and shop"
expected = [
    "runbooks/dependency-down.md",
    "docs/services/shop.md#Failure behaviour",
    "docs/services/users.md#Failure behaviour",
]

[[questions]]
query = "where is the stock reservation released when a charge is declined"
expected = ["services/shop/handlers.py::create_order"]

[[questions]]
query = "code that deducts stock when a product is reserved"
expected = ["services/inventory/handlers.py::reserve"]

[[questions]]
query = "how is stock replenished automatically"
expected = ["services/inventory/handlers.py::restock", "docs/services/inventory.md#Restocking"]

[[questions]]
query = "SQL query that returns the product catalogue"
expected = ["services/inventory/handlers.py::list_products"]

[[questions]]
query = "user profile cache in redis and its TTL"
expected = ["services/users/handlers.py::get_user", "config/users.env", "docs/services/users.md#Data"]

[[questions]]
query = "what shop does when a dependency responds 429 or a 5xx error"
expected = ["services/shop/handlers.py::call", "docs/services/shop.md#Endpoints"]

[[questions]]
query = "shop's timeout towards internal services UPSTREAM_TIMEOUT_SECONDS"
expected = ["config/shop.env", "docs/services/shop.md#Dependencies"]

[[questions]]
query = "size of the connection pool to the inventory database"
expected = ["config/inventory.env"]

[[questions]]
query = "payment provider URL and requests per second limit"
expected = ["config/payments.env"]

[[questions]]
query = "what happens if the same order is charged twice"
expected = ["services/payments/handlers.py::charge", "docs/services/payments.md#Data"]

[[questions]]
query = "what metrics the services expose and how to calculate p95 latency"
expected = ["docs/observability.md#Metrics"]

[[questions]]
query = "step-by-step flow of an order between the services"
expected = ["docs/architecture.md#Order flow"]
