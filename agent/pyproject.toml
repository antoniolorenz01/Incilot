[project]
name = "incilot-agent"
version = "0.1.0"
description = "IncidentPilot: el agente que investiga incidentes en la mini-empresa"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
