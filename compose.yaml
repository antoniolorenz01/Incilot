# Simulated mini-company + observability stack. `docker compose up --build`.
#
#   Shop        http://localhost:8000/docs
#   Prometheus  http://localhost:9090
#   Loki        http://localhost:3100
#   Grafana     http://localhost:3000
#   Injector    http://localhost:8100/docs
#   Agent       http://localhost:8200/docs
#
# Background noise (transient errors, latency and traffic spikes) is on by
# default; `BACKGROUND_NOISE=off make up` to debug the agent on a clean signal.

# All services share the same image; only `shop` builds it.
x-service: &service
  image: incilot-sim
  pull_policy: never
  restart: unless-stopped
  labels:
    incilot.logs: "true"
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 5s
    timeout: 3s
    retries: 10

x-agent: &agent
  image: incilot-agent
  pull_policy: never
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  # LLM_PROVIDER=claude-code (local only): the model is Claude Code via the bridge that
  # `make claude-bridge` runs on the host.
  extra_hosts: ["host.docker.internal:host-gateway"]
  environment:
    PROMETHEUS_URL: http://prometheus:9090
    LOKI_URL: http://loki:3100
    COMPANY_REPO: /company-repo
    RUNBOOKS_DIR: /runbooks
    DOCS_DIR: /docs
    POSTGRES_HOST: postgres
    # Its own Redis for the queue and events: an incident that takes the shop's Redis
    # down must not take the incident tooling with it.
    AGENT_REDIS_URL: redis://default:agent@agent-redis:6379/0
    # Executor for approved actions: used by the graph's `execute` node, never by the LLM.
    OPS_URL: http://injector:8000/ops/execute
    OPS_TOKEN: ${OPS_TOKEN:-incilot-ops-dev}
  volumes:
    - company-repo:/company-repo:ro
    - ${INCILOT_DATA:-../incilot-data}/runbooks:/runbooks:ro
    - ./docs:/docs:ro
  depends_on:
    postgres:
      condition: service_healthy
    agent-redis:
      condition: service_healthy

x-db-and-cache: &db-and-cache
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  # --- Mini-company -----------------------------------------------------------

  shop:
    <<: *service
    build:
      context: .
      dockerfile: sim/Dockerfile
    command: uvicorn incilot_sim.services.shop:app --host 0.0.0.0 --port 8000 --no-access-log
    environment:
      DATABASE_URL: postgresql://incilot:incilot@postgres:5432/shop
      BACKGROUND_NOISE: ${BACKGROUND_NOISE:-on}
      FAULTS_REDIS_URL: redis://redis:6379/2
      REDIS_URL: redis://redis:6379/1
      USERS_URL: http://users:8000
      INVENTORY_URL: http://inventory:8000
      PAYMENTS_URL: http://payments:8000
    ports: ["8000:8000"]
    depends_on:
      <<: *db-and-cache
      users:
        condition: service_healthy
      inventory:
        condition: service_healthy
      payments:
        condition: service_healthy

  users:
    <<: *service
    command: uvicorn incilot_sim.services.users:app --host 0.0.0.0 --port 8000 --no-access-log
    environment:
      DATABASE_URL: postgresql://incilot:incilot@postgres:5432/users
      BACKGROUND_NOISE: ${BACKGROUND_NOISE:-on}
      FAULTS_REDIS_URL: redis://redis:6379/2
      REDIS_URL: redis://redis:6379/0
    depends_on: *db-and-cache

  inventory:
    <<: *service
    command: uvicorn incilot_sim.services.inventory:app --host 0.0.0.0 --port 8000 --no-access-log
    environment:
      DATABASE_URL: postgresql://incilot:incilot@postgres:5432/inventory
      BACKGROUND_NOISE: ${BACKGROUND_NOISE:-on}
      FAULTS_REDIS_URL: redis://redis:6379/2
    depends_on: *db-and-cache

  payments:
    <<: *service
    command: uvicorn incilot_sim.services.payments:app --host 0.0.0.0 --port 8000 --no-access-log
    environment:
      DATABASE_URL: postgresql://incilot:incilot@postgres:5432/payments
      BACKGROUND_NOISE: ${BACKGROUND_NOISE:-on}
      FAULTS_REDIS_URL: redis://redis:6379/2
    depends_on: *db-and-cache

  traffic:
    <<: *service
    command: python -m incilot_sim.traffic
    environment:
      SHOP_URL: http://shop:8000
      BACKGROUND_NOISE: ${BACKGROUND_NOISE:-on}
      TRAFFIC_SHOPPERS: "5"
    healthcheck:
      disable: true
    depends_on:
      shop:
        condition: service_healthy

  postgres:
    # Postgres 16 with pgvector: embeddings for the agent's RAG (agent_state database).
    image: pgvector/pgvector:0.8.7-pg16
    restart: unless-stopped
    # Logs lock waits longer than 1 s (deadlock_timeout).
    command: postgres -c log_lock_waits=on
    environment:
      POSTGRES_USER: incilot
      POSTGRES_PASSWORD: incilot
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    labels:
      incilot.logs: "true"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "incilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Agent user: read-only on the caches (user:*, catalog); cannot see faults:*, list
    # keys or flush databases. Its queue and events live in agent-redis.
    command:
      - redis-server
      - --user
      - "agent"
      - "on"
      - ">agent"
      - "%R~user:*"
      - "%R~catalog"
      - "~investigation:*"
      - "+@read"
      - "+@write"
      - "+@list"
      - "+@stream"
      - "+@hash"
      - "+select"
      - "+ping"
      - "-@dangerous"
      - "-scan"
      - "-keys"
      - "-randomkey"
    labels:
      incilot.logs: "true"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The agent's own Redis (investigation queue and events), apart from the shop's.
  agent-redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Saved to disk: the event streams are what replays past investigations.
    command: ["redis-server", "--requirepass", "agent", "--appendonly", "yes"]
    volumes:
      - agent-redis-data:/data
    # The web keeps the demo's turns here (db 1); only reachable from this machine.
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "agent", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Fault injector ---------------------------------------------------------
  # No incilot.logs label and no metrics: the agent must not see the ground truth.

  injector:
    image: incilot-sim
    pull_policy: never
    restart: unless-stopped
    command: uvicorn incilot_sim.injector.api:app --host 0.0.0.0 --port 8000
    environment:
      INJECTOR_DATA: /data
      COMPANY_REPO: /company-repo
      GROUNDTRUTH_DATABASE_URL: postgresql://incilot:incilot@postgres:5432/groundtruth
      OPS_TOKEN: ${OPS_TOKEN:-incilot-ops-dev}
      FAULTS_REDIS_URL: redis://redis:6379/2
    volumes:
      - ${INCILOT_DATA:-../incilot-data}:/data:ro
      - company-repo:/company-repo
      # For infrastructure faults (stopping and starting containers).
      - /var/run/docker.sock:/var/run/docker.sock
    ports: ["8100:8000"]
    depends_on: *db-and-cache

  # --- Agent -------------------------------------------------------------------
  # Sandbox: an image without the simulation code, an unprivileged user, only the
  # `agent` credentials, and the company repo and runbooks mounted read-only. No
  # Docker socket and no incilot-data/scenarios.
  #
  #   agent-api     API: start, follow (SSE) and approve investigations — :8200
  #   agent-worker  runs the investigations the API queues
  #   agent         the console (`make investigate`); not started by `make up`

  agent-api:
    <<: *agent
    build:
      context: .
      dockerfile: agent/Dockerfile
    command: uvicorn incilot_agent.api:app --host 0.0.0.0 --port 8000
    ports: ["8200:8000"]

  agent-worker:
    <<: *agent
    command: python -m incilot_agent.worker

  agent:
    <<: *agent
    profiles: ["agent"]
    command: python -m incilot_agent.investigate

  # --- Observability ----------------------------------------------------------

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports: ["3100:3100"]

  alloy:
    image: grafana/alloy:v1.7.1
    restart: unless-stopped
    command: run --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, loki]

volumes:
  postgres-data:
  agent-redis-data:
  company-repo:
