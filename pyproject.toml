[project]
name = "incilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["incilot-sim"]

[dependency-groups]
dev = ["ruff>=0.14", "pytest>=8"]

[tool.uv]
package = false

[tool.uv.sources]
incilot-sim = { workspace = true }

[tool.uv.workspace]
members = ["sim"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["incilot_sim"]

[tool.pytest.ini_options]
testpaths = ["sim/tests"]
