# Mini-empresa simulada + stack de observabilidad. `docker compose up --build`.
#
#   Tienda      http://localhost:8000/docs
#   Prometheus  http://localhost:9090
#   Loki        http://localhost:3100
#   Grafana     http://localhost:3000
#   Injector    http://localhost:8100/docs
#   Agente      http://localhost:8200/docs
#
# Ruido de fondo (errores transitorios, picos de latencia y de tráfico) encendido
# por defecto; `BACKGROUND_NOISE=off make up` para depurar el agente en limpio.

# Todos los servicios usan la misma imagen; solo `shop` la construye.
x-service: &service
  image: incilot-sim
  pull_policy: never
  restart: unless-stopped
  labels:
    incilot.logs: "true"
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 5s
    timeout: 3s
    retries: 10

x-agent: &agent
  image: incilot-agent
  pull_policy: never
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    PROMETHEUS_URL: http://prometheus:9090
    LOKI_URL: http://loki:3100
    COMPANY_REPO: /company-repo
    RUNBOOKS_DIR: /runbooks
    POSTGRES_HOST: postgres
    AGENT_REDIS_URL: redis://agent:agent@redis:6379/3
  volumes:
    - company-repo:/company-repo:ro
    - ${INCILOT_DATA:-../incilot-data}/runbooks:/runbooks:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

x-db-and-cache: &db-and-cache
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  # --- Mini-empresa -----------------------------------------------------------

  shop:
    <<: *service
    build:
      context: .
      dockerfile: sim/Dockerfile
    command: uvicorn incilot_sim.services.shop:app --host 0.0.0.0 --port 8000 --no-access-log
    environment:
      DATABASE_URL: postgresql://incilot:incilot@postgres:5432/shop
      BACKGROUND_NOISE: ${BACKGROUND_NOISE:-on}
      FAULTS_REDIS_URL: redis://redis:6379/2
      REDIS_URL: redis://redis:6379/1
      USERS_URL: http://users:8000
      INVENTORY_URL: http://inventory:8000
      PAYMENTS_URL: http://payments:8000
    ports: ["8000:8000"]
    depends_on:
      <<: *db-and-cache
      users:
        condition: service_healthy
      inventory:
        condition: service_healthy
      payments:
        condition: service_healthy

  users:
    <<: *service
    command: uvicorn incilot_sim.services.users:app --host 0.0.0.0 --port 8000 --no-access-log
    environment:
      DATABASE_URL: postgresql://incilot:incilot@postgres:5432/users
      BACKGROUND_NOISE: ${BACKGROUND_NOISE:-on}
      FAULTS_REDIS_URL: redis://redis:6379/2
      REDIS_URL: redis://redis:6379/0
    depends_on: *db-and-cache

  inventory:
    <<: *service
    command: uvicorn incilot_sim.services.inventory:app --host 0.0.0.0 --port 8000 --no-access-log
    environment:
      DATABASE_URL: postgresql://incilot:incilot@postgres:5432/inventory
      BACKGROUND_NOISE: ${BACKGROUND_NOISE:-on}
      FAULTS_REDIS_URL: redis://redis:6379/2
    depends_on: *db-and-cache

  payments:
    <<: *service
    command: uvicorn incilot_sim.services.payments:app --host 0.0.0.0 --port 8000 --no-access-log
    environment:
      DATABASE_URL: postgresql://incilot:incilot@postgres:5432/payments
      BACKGROUND_NOISE: ${BACKGROUND_NOISE:-on}
      FAULTS_REDIS_URL: redis://redis:6379/2
    depends_on: *db-and-cache

  traffic:
    <<: *service
    command: python -m incilot_sim.traffic
    environment:
      SHOP_URL: http://shop:8000
      BACKGROUND_NOISE: ${BACKGROUND_NOISE:-on}
      TRAFFIC_SHOPPERS: "5"
    healthcheck:
      disable: true
    depends_on:
      shop:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    # Loguea las esperas por locks de más de 1 s (deadlock_timeout).
    command: postgres -c log_lock_waits=on
    environment:
      POSTGRES_USER: incilot
      POSTGRES_PASSWORD: incilot
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    labels:
      incilot.logs: "true"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "incilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # Usuario del agente: solo lee las cachés (user:*, catalog), lee y escribe su cola y
    # sus eventos (investigation:*); no ve faults:*, no lista claves ni borra bases.
    command:
      - redis-server
      - --user
      - "agent"
      - "on"
      - ">agent"
      - "%R~user:*"
      - "%R~catalog"
      - "~investigation:*"
      - "+@read"
      - "+@write"
      - "+@list"
      - "+@stream"
      - "+@hash"
      - "+select"
      - "+ping"
      - "-@dangerous"
      - "-scan"
      - "-keys"
      - "-randomkey"
    labels:
      incilot.logs: "true"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Injector de fallos -----------------------------------------------------
  # Sin la etiqueta incilot.logs ni métricas: el agente no debe ver el ground truth.

  injector:
    image: incilot-sim
    pull_policy: never
    restart: unless-stopped
    command: uvicorn incilot_sim.injector.api:app --host 0.0.0.0 --port 8000
    environment:
      INJECTOR_DATA: /data
      COMPANY_REPO: /company-repo
      GROUNDTRUTH_DATABASE_URL: postgresql://incilot:incilot@postgres:5432/groundtruth
      FAULTS_REDIS_URL: redis://redis:6379/2
    volumes:
      - ${INCILOT_DATA:-../incilot-data}:/data:ro
      - company-repo:/company-repo
      # Para los fallos de infraestructura (parar y arrancar contenedores).
      - /var/run/docker.sock:/var/run/docker.sock
    ports: ["8100:8000"]
    depends_on: *db-and-cache

  # --- Agente ------------------------------------------------------------------
  # Sandbox: imagen sin el código de la simulación, usuario sin privilegios, solo las
  # credenciales `agent` y el repo de la empresa y los runbooks en solo lectura. Sin
  # socket de Docker ni incilot-data/scenarios.
  #
  #   agent-api     API: lanzar, seguir (SSE) y aprobar investigaciones — :8200
  #   agent-worker  corre las investigaciones que encola la API
  #   agent         la consola (`make investigate`); no arranca con `make up`

  agent-api:
    <<: *agent
    build:
      context: .
      dockerfile: agent/Dockerfile
    command: uvicorn incilot_agent.api:app --host 0.0.0.0 --port 8000
    ports: ["8200:8000"]

  agent-worker:
    <<: *agent
    command: python -m incilot_agent.worker

  agent:
    <<: *agent
    profiles: ["agent"]
    command: python -m incilot_agent.investigate

  # --- Observabilidad ---------------------------------------------------------

  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  loki:
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/local-config.yaml
    ports: ["3100:3100"]

  alloy:
    image: grafana/alloy:v1.7.1
    command: run --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, loki]

volumes:
  postgres-data:
  company-repo:
