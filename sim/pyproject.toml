[project]
name = "incilot-sim"
version = "0.1.0"
description = "Simulated mini-company that IncidentPilot investigates"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "docker>=7.2.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "prometheus-client>=0.26.0",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
